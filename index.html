<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间上的中国</title>
  <meta name="description" content="从古人类时期到1980年的中国历史时间轴，拖拽浏览一百个重大历史事件。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%23b0302a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'%3E史%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-name">时间上的中国</span><span class="brand-era" id="currentEra" aria-live="polite"></span></h1>
  </header>
  <!-- 调试信息：只在调试模式下显示 -->
  <div class="debug-bar debug-only" id="debugBar" aria-live="polite">
    网站最近更新：<time id="debugUpdated">…</time><span class="debug-commit" id="debugCommit"></span>
  </div>

  <main class="stage" id="stage" tabindex="0" aria-label="历史时间轴，可左右拖动或使用方向键浏览">
    <div class="track" id="track">
      <div class="era-wash" id="eraWash" aria-hidden="true"></div>
      <div class="axis" id="axis"></div>
      <div class="axis-hit" id="axisHit" title=""></div>
      <div class="eras" id="eras"></div>
      <div class="ticks" id="ticks"></div>
      <div class="events" id="events"></div>
    </div>
    <div class="era-tip" id="eraTip" hidden aria-live="polite">
      <div class="era-tip-line"></div>
      <div class="era-tip-box"></div>
    </div>
    <button class="nav-arrow left" id="navLeft" aria-label="向前">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <button class="nav-arrow right" id="navRight" aria-label="向后">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
    </button>
  </main>

  <footer class="bottombar">
    <div class="minimap" id="minimap" title="点击快速跳转">
      <div class="minimap-view" id="minimapView"></div>
    </div>
    <button class="btn btn-primary browse-btn" id="browseBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      浏览所有历史事件
    </button>
  </footer>

  <button class="bars-toggle" id="barsToggle" aria-pressed="false" aria-label="隐藏工具栏" title="隐藏工具栏（H）">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h16v2H4zm0 14h16v2H4zm4-8 4-3 4 3-1.2 1.6L12 9.5l-2.8 2.1zm0 4 1.2-1.6 2.8 2.1 2.8-2.1L16 14l-4 3z"/></svg>
  </button>

  <button class="fab debug-only" id="addBtn" aria-label="添加新事件" title="添加新事件">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <!-- 侧栏：全部事件 -->
  <div class="scrim" id="sidebarScrim" hidden></div>
  <aside class="sidebar" id="sidebar" aria-hidden="true" aria-label="全部历史事件">
    <div class="sidebar-head">
      <h2>全部历史事件 <span class="count" id="eventCount"></span></h2>
      <button class="icon-btn" id="closeSidebar" aria-label="关闭">&times;</button>
    </div>
    <div class="sidebar-search">
      <input type="search" id="searchInput" placeholder="搜索事件、年代…" autocomplete="off">
      <button type="button" class="btn btn-ghost btn-small filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
        筛选<span class="filter-badge" id="filterBadge" hidden></span>
      </button>
    </div>
    <div class="filter-panel" id="filterPanel" hidden></div>
    <ol class="event-list" id="eventList"></ol>
    <div class="sidebar-foot">
      <label class="switch" title="开启后显示网站更新时间和编辑功能">
        <input type="checkbox" role="switch" id="debugToggle">
        <span class="switch-track" aria-hidden="true"></span>
        <span>调试模式</span>
      </label>
      <div class="debug-only foot-edit">
        <p class="storage-note" id="storageNote"></p>
        <button class="btn btn-ghost btn-small" id="resetBtn">恢复默认数据</button>
      </div>
    </div>
  </aside>

  <!-- 详情弹窗 -->
  <div class="modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card detail-card">
      <button class="icon-btn modal-close" data-close aria-label="关闭">&times;</button>
      <div class="detail-hero" id="detailHero"></div>
      <div class="detail-body">
        <div class="detail-date" id="detailDate"></div>
        <div class="detail-transition" id="detailTransition" hidden></div>
        <h2 id="detailTitle"></h2>
        <p class="detail-text" id="detailText"></p>
        <div class="gallery" id="detailGallery"></div>
        <div class="detail-source" id="detailSource"></div>
        <div class="detail-actions debug-only">
          <button class="btn btn-primary" id="detailEdit">编辑</button>
          <button class="btn btn-danger" id="detailDelete">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑 / 新建弹窗 -->
  <div class="modal" id="editModal" hidden role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-backdrop" data-close></div>
    <form class="modal-card edit-card" id="editForm" novalidate>
      <button type="button" class="icon-btn modal-close" data-close aria-label="关闭">&times;</button>
      <h2 id="editTitle">编辑事件</h2>
      <label class="field">
        <span>事件名称 <em>*</em></span>
        <input type="text" name="title" maxlength="40" required>
      </label>
      <div class="field-row">
        <label class="field">
          <span>纪年</span>
          <select name="era">
            <option value="ce">公元</option>
            <option value="bce">公元前</option>
          </select>
        </label>
        <label class="field">
          <span>年份 <em>*</em></span>
          <input type="number" name="yearAbs" min="1" step="1" required>
        </label>
        <label class="field grow">
          <span>时间显示（可选）</span>
          <input type="text" name="date" maxlength="20" placeholder="如：约前2070年">
        </label>
      </div>
      <div class="field-row transition-row">
        <label class="field">
          <span>时期更迭（可选）：从</span>
          <select name="transitionFrom"></select>
        </label>
        <label class="field">
          <span>到</span>
          <select name="transitionTo"></select>
        </label>
      </div>
      <label class="check">
        <input type="checkbox" name="major"> 重大事件（在时间轴上以大卡片突出显示）
      </label>
      <label class="field">
        <span>简要说明 <small class="counter" data-for="short"></small></span>
        <textarea name="short" rows="2" maxlength="60" placeholder="显示在时间轴卡片上，至少 20 字（留空则自动截取详细说明）"></textarea>
      </label>
      <label class="field">
        <span>详细说明 <small class="counter" data-for="detail"></small></span>
        <textarea name="detail" rows="6" maxlength="350"></textarea>
      </label>
      <div class="field">
        <span>图片（最多 9 张，第一张为代表图；上传后保存在本地；可在每张图下方填写标题）</span>
        <div class="image-editor" id="imageEditor"></div>
        <div class="image-add">
          <input type="url" id="imageUrlInput" placeholder="粘贴图片网址，自动下载到本地">
          <button type="button" class="btn btn-ghost btn-small" id="imageUrlAdd">添加网址</button>
          <label class="btn btn-ghost btn-small file-btn">
            上传图片
            <input type="file" id="imageFileInput" accept="image/*" multiple hidden>
          </label>
        </div>
      </div>
      <label class="field">
        <span>参考链接（可选）</span>
        <input type="url" name="source" placeholder="https://zh.wikipedia.org/wiki/…">
      </label>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="detail-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-ghost" data-close>取消</button>
      </div>
    </form>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal" id="confirmModal" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card confirm-card">
      <p id="confirmText"></p>
      <div class="detail-actions">
        <button class="btn btn-danger" id="confirmOk">确定</button>
        <button class="btn btn-ghost" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 图片查看 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lb-close" aria-label="关闭">&times;</button>
    <button class="lb-nav lb-prev" aria-label="上一张">&#8249;</button>
    <figure>
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" aria-label="下一张">&#8250;</button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
