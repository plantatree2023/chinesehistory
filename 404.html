<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404</title>
  <!-- 页面不存在。这个页面可能出现在任意路径下（如 /a/b/c），所以样式全部内联，网址都由脚本按网站根目录生成 -->
  <style>
    :root {
      --paper: #f3ecdf;
      --texture-ink: #6b4a2b;
      --card: #fffcf6;
      --ink: #2a2521;
      --ink-2: #4a423b;
      --muted: #7a6e62;
      --line: #d9ccb5;
      --red: #a8322a;
      --red-dark: #86241e;
      --red-fill: #a8322a;
      --axis: #4a423b;
      --glow-1: rgba(255, 255, 255, .55);
      --glow-2: rgba(176, 141, 87, .12);
      --bar-bg: rgba(255, 252, 246, .6);
      --shadow: 0 6px 18px rgba(60, 40, 20, .14), 0 1px 3px rgba(60, 40, 20, .12);
      --band-1: rgba(168, 50, 42, .28);
      --band-2: rgba(176, 141, 87, .32);
      --band-3: rgba(79, 122, 106, .28);
      --band-4: rgba(90, 106, 160, .26);
      color-scheme: light;
      --font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Source Han Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    :root[data-theme="dark"] {
      --paper: #1b1815;
      --texture-ink: #e9d9bd;
      --card: #2a2622;
      --ink: #ece4d6;
      --ink-2: #d2c7b6;
      --muted: #a0937f;
      --line: #463e35;
      --red: #ea7b6f;
      --red-dark: #9f3a31;
      --red-fill: #a93d34;
      --axis: #6f655a;
      --glow-1: rgba(255, 236, 200, .035);
      --glow-2: rgba(176, 141, 87, .08);
      --bar-bg: rgba(30, 26, 23, .82);
      --shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
      --band-1: rgba(234, 123, 111, .26);
      --band-2: rgba(201, 164, 106, .28);
      --band-3: rgba(120, 170, 150, .24);
      --band-4: rgba(140, 155, 210, .24);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: var(--paper);
      background-image: radial-gradient(ellipse at 50% 40%, var(--glow-1), transparent 60%), radial-gradient(ellipse at 80% 90%, var(--glow-2), transparent 50%);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .brand {
      display: inline-block;
      margin: 18px 28px;
      font-family: 'Ma Shan Zheng Title', var(--font-serif);
      font-size: 26px;
      color: var(--red);
      text-decoration: none;
    }
    main {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px 60px;
    }
    .axis { position: relative; width: min(900px, 100%); height: 70px; margin-bottom: 18px; }
    .axis .line { position: absolute; top: 34px; height: 3px; background: var(--axis); }
    .axis .l1 { left: 0; width: 42%; }
    .axis .l2 { right: 0; width: 42%; }
    .axis .gap { position: absolute; top: 34px; left: 42%; width: 16%; border-top: 3px dashed var(--muted); }
    .axis .band { position: absolute; top: 26px; height: 19px; border-radius: 3px; }
    .axis .tick { position: absolute; top: 40px; width: 1px; height: 8px; background: var(--axis); }
    .axis .q {
      position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--card); border: 2px solid var(--red); color: var(--red);
      font: 700 26px/46px var(--font-serif); text-align: center;
      box-shadow: var(--shadow);
    }
    h1 { font-family: var(--font-serif); font-weight: 700; font-size: 34px; margin: 10px 0 12px; letter-spacing: .08em; }
    p { font-family: var(--font-serif); color: var(--ink-2); font-size: 16px; line-height: 1.9; margin: 0 0 28px; max-width: 30em; }
    .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 10px 22px; border-radius: 8px; font-size: 15px; border: 1px solid transparent; text-decoration: none; }
    .btn-primary { background: var(--red-fill); color: #fff; box-shadow: var(--shadow); }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-ghost { color: var(--ink-2); border-color: var(--line); background: var(--bar-bg); }
    .btn-ghost:hover { border-color: var(--ink-2); }
    .btn[hidden] { display: none; }
    .code { margin-top: 28px; font-family: var(--font-serif); color: var(--muted); font-size: 13px; letter-spacing: .3em; }
    @media (max-width: 640px) {
      .brand { font-size: 19px; margin: 14px 16px; }
      h1 { font-size: 26px; }
      p { font-size: 15px; }
      .axis .l1, .axis .l2 { width: 36%; }
      .axis .gap { left: 36%; width: 28%; }
    }
  </style>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('zh-history-timeline:theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <a class="brand" id="brand" href="./"></a>
  <main>
    <div class="axis" aria-hidden="true">
      <div class="band" style="left:4%;width:20%;background:var(--band-1)"></div>
      <div class="band" style="left:24%;width:18%;background:var(--band-2)"></div>
      <div class="band" style="left:58%;width:16%;background:var(--band-3)"></div>
      <div class="band" style="left:74%;width:22%;background:var(--band-4)"></div>
      <div class="line l1"></div><div class="gap"></div><div class="line l2"></div>
      <span class="tick" style="left:14%"></span><span class="tick" style="left:33%"></span>
      <span class="tick" style="left:66%"></span><span class="tick" style="left:85%"></span>
      <div class="q">?</div>
    </div>
    <h1 id="heading"></h1>
    <p id="message"></p>
    <div class="btns">
      <a class="btn btn-primary" id="homeLink" href="./"></a>
      <a class="btn btn-ghost" id="randomLink" href="./" hidden></a>
    </div>
    <div class="code">404</div>
  </main>
  <script>
    (function () {
      // 各语言的文字：新增语言时在这里加一项（键为语言代码），按浏览器语言选择，没有时用中文
      var STRINGS = {
        zh: {
          lang: 'zh-CN',
          title: '页面不存在 · 时间上的中国',
          brand: '时间上的中国',
          heading: '这一页不在时间轴上',
          message: '这个网址没有对应的页面，可能是地址写错了，或者页面已经移走。',
          home: '回到时间轴',
          random: '随便看一个事件',
          dataset: 'cn_zh'
        }
      };
      var langs = (navigator.languages || [navigator.language || '']).map(function (l) { return String(l).toLowerCase().split('-')[0]; });
      var s = STRINGS[langs.filter(function (l) { return STRINGS[l]; })[0] || 'zh'];

      // 网站根目录：GitHub Pages 的项目网站在 /<仓库名>/ 下，其他托管在 /
      var root = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
      if (location.protocol === 'file:') root = './';

      var font = document.createElement('style');
      font.textContent = "@font-face { font-family: 'Ma Shan Zheng Title'; src: url(" + root + "css/fonts/ma-shan-zheng-title.woff2) format('woff2'); font-display: swap; }";
      document.head.appendChild(font);

      document.documentElement.lang = s.lang;
      document.title = s.title;
      function set(id, text, href) {
        var el = document.getElementById(id);
        el.textContent = text;
        if (href) el.href = href;
      }
      set('brand', s.brand, root);
      set('heading', s.heading);
      set('message', s.message);
      set('homeLink', s.home, root);

      // 随便看一个事件：从数据集中随机选一个，打开它的详情
      fetch(root + 'data/' + s.dataset + '.json').then(function (res) {
        return res.ok ? res.json() : Promise.reject(res.status);
      }).then(function (data) {
        var events = (data.events || []).filter(function (e) { return e && e.id; });
        if (!events.length) return;
        var ev = events[Math.floor(Math.random() * events.length)];
        var link = document.getElementById('randomLink');
        set('randomLink', s.random, root + '?id=' + encodeURIComponent(ev.id));
        link.hidden = false;
      }).catch(function () { /* 取不到数据时只显示“回到时间轴” */ });
    })();
  </script>
</body>
</html>
