name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js data images audio _site/
          touch _site/.nojekyll
      # 网页调试模式显示的“网站最近更新”时间：每次部署（每次 push 到 main）都会重新生成
      - name: Write version info
        run: |
          printf '{"updatedAt":"%s","commit":"%s","commitAt":"%s","source":"deploy"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" "$(git log -1 --format=%cI)" > _site/version.json
          cat _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
