name: Deploy redirect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # 网站已迁到 Cloudflare（package.json 的 homepage）。GitHub Pages 只保留跳转：旧地址的每个网页（首页、事件页）
      # 带着网址参数跳到新地址的同一页，其他地址由 404.html 按路径跳转（tools/build-redirect.js）
      - name: Build redirect site
        run: node tools/build-redirect.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
