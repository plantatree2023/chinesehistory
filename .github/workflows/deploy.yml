name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # 复制网页文件、生成事件静态页（e/）、sitemap.xml、robots.txt，以及调试模式显示“网站最近更新”时间用的
      # version.json：与 Cloudflare Pages 用同一个脚本（tools/build-site.js），每次部署（每次 push 到 main）都重新生成
      - name: Build site
        run: node tools/build-site.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
